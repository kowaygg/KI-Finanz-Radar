# Stündlicher Wächter: Push-Warnung aufs Handy, wenn der Abruf seit mehr als 3 Stunden nicht lief.
# Liest nur den öffentlichen Status der App – kein Zugriff auf Schlüssel außer dem ntfy-Kanal.
name: Wächter

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  waechter:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Code holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.0"

      - name: Abruf prüfen
        env:
          NTFY_KANAL: ${{ secrets.NTFY_KANAL }}
        run: node scripts/waechter.js
